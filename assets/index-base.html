<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/tokens.css" />
    <link rel="stylesheet" href="assets/dv-video.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 32%; }
      #footage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
    <script>
      /* Entradas e saídas padrão do guia de movimento (03_referencias/guia_visual.md). */
      window.DV = {
        enter(tl, target, at, opts = {}) {
          tl.fromTo(target,
            { opacity: 0, y: opts.y ?? 32, filter: "blur(8px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: opts.duration ?? 0.55, ease: "expo.out" }, at);
        },
        exit(tl, target, at) {
          tl.to(target, { opacity: 0, y: -16, filter: "blur(6px)", duration: 0.28, ease: "power3.in" }, at);
        },
        words(tl, target, at, gap = 0.08) {
          tl.fromTo(target, { opacity: 0, filter: "blur(6px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out", stagger: gap }, at);
        },
        rule(tl, target, at) {
          tl.fromTo(target, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, at);
        },
      };
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="DURACAO_TOTAL" data-width="1080" data-height="1920">
      <div id="cam">
        <video id="footage" class="clip" src="assets/video.mp4" data-start="0" data-duration="DURACAO_DO_VIDEO" data-track-index="0" playsinline data-has-audio="true"></video>
      </div>


      <!-- Cenas: <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01-nome.html" data-start="…" data-duration="…" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div> -->
      <!-- Efeitos: <audio id="sfx01" class="clip" src="assets/sfx/whoosh-a.mp3" data-start="…" data-duration="0.575" data-track-index="3" data-volume="0.08"></audio> -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      /* Punch-in no rosto (opcional): tl.fromTo("#cam", { scale: 1 }, { scale: 1.08, duration: 0.6, ease: "power2.inOut" }, T); tl.to("#cam", { scale: 1, duration: 0.6, ease: "power2.inOut" }, T2); */
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
